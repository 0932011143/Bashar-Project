<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>نظام التحقق التركي 🇹🇷</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background: #f0f2f5;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .corner-flag {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-main {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        #result {
            margin-top: 20px;
            display: none;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
        }
    </style>
</head>

<body>

    <img src="https://flagcdn.com" class="corner-flag">

    <div class="container">
        <h2>نظام التحقق الذكي</h2>
        <input type="text" id="vId" placeholder="رقم الهوية للبحث...">
        <button class="btn btn-main" onclick="checkUser()">تحقق الآن</button>
        <div id="result"></div>
        <button class="btn" style="background:#eee" onclick="openAdd()">➕ إضافة مستخدم جديد</button>
    </div>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>تسجيل جديد</h3>
            <input type="text" id="nId" placeholder="رقم الهوية">
            <input type="text" id="nName" placeholder="الاسم الكامل">
            <input type="text" id="nImg" placeholder="رابط الصورة">
            <button class="btn btn-main" id="saveBtn" onclick="saveUser()">حفظ البيانات</button>
            <div id="qrPlace" style="margin-top:15px; display:flex; justify-content:center;"></div>
            <button class="btn" onclick="location.reload()">إغلاق</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcDPXlIyCoA-S-tlUGA4MyYxF-KQjtt5uqWG2JDnO3k7KvbuD2va8x5XNUUyVgpu-A/exec";

        function openAdd() { document.getElementById('addModal').style.display = 'flex'; }

        async function saveUser() {
            const id = document.getElementById('nId').value;
            const name = document.getElementById('nName').value;
            const img = document.getElementById('nImg').value;
            const btn = document.getElementById('saveBtn');

            if (!id || !name) return alert("أكمل البيانات");
            btn.innerText = "جاري الحفظ...";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ id, name, image: img })
                });
                alert("تم الحفظ بنجاح!");
                document.getElementById('qrPlace').innerHTML = "";
                new QRCode(document.getElementById("qrPlace"), { text: id, width: 120, height: 120 });
                btn.innerText = "تم الحفظ ✅";
            } catch (e) {
                alert("خطأ في الاتصال");
                btn.innerText = "حفظ البيانات";
            }
        }

        async function checkUser() {
            const id = document.getElementById('vId').value;
            const resDiv = document.getElementById('result');
            if (!id) return;
            resDiv.style.display = 'block'; resDiv.innerHTML = "جاري البحث...";

            const res = await fetch(`${SCRIPT_URL}?id=${id}`);
            const data = await res.json();

            if (data.status === "found") {
                resDiv.innerHTML = `<h3 style="color:green">Onaylandı ✅</h3><img src="${data.image}" class="profile-img"><br><b>${data.name}</b>`;
            } else {
                resDiv.innerHTML = `<h3 style="color:red">Kayıt bulunamadı ❌</h3>`;
            }
        }
    </script>
</body>

</html>
